name: Generate trophy card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download SVG manually via cURL (Bypass Plugin Error)
        run: |
          mkdir -p dist
          curl -sL "https://github-profile-trophy.vercel.app/?username=Idooo2202&theme=onedark&column=4&row=2&margin-w=8&margin-h=8" -o dist/trophy.svg
          
      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}