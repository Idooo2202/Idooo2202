name: generate pacman game

on:
  schedule: 
    - cron: "0 */24 * * *"
  workflow_dispatch: 
  push: 
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📁 Create dist directory
        run: mkdir -p dist

      - name: ☀️ Generate Pac-Man (Light Theme)
        run: npx pacman-contribution-graph --game pacman --username ${{ github.repository_owner }} --platform github --gameTheme github --output dist/pacman-light.svg

      - name: 🌙 Generate Pac-Man (Dark Theme)
        run: npx pacman-contribution-graph --game pacman --username ${{ github.repository_owner }} --platform github --gameTheme github-dark --output dist/pacman-dark.svg

      - name: 🚀 Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}